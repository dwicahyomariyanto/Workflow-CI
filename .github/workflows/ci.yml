name: CI - Retrain Model with MLflow Project

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: credit-scoring

jobs:
  retrain:
    runs-on: ubuntu-24.04

    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version
          docker --version
          ls -R MLProject | head -n 30

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn==1.5.2 pandas==2.2.3 numpy==2.1.3 matplotlib==3.9.2

      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=file://${{ github.workspace }}/mlruns" >> $GITHUB_ENV

      - name: Run mlflow project
        run: |
          mlflow run MLProject --env-manager=local --experiment-name "Credit Scoring CI"

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(python - <<'PY'
          import mlflow
          runs = mlflow.search_runs(experiment_names=["Credit Scoring CI"],
                                    order_by=["attributes.start_time DESC"], max_results=1)
          print(runs.iloc[0]["run_id"])
          PY
          )
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Upload to GitHub
        run: |
          mkdir -p artifacts
          rm -rf artifacts/model
          mlflow artifacts download --run-id "$RUN_ID" --artifact-path model --dst-path artifacts
          echo "$RUN_ID" > artifacts/latest_run_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan artefak."
          else
            git commit -m "ci: save model artifacts from run $RUN_ID [skip ci]"
            git push
          fi

      - name: Upload artifact (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/

      - name: Build Docker Model
        run: |
          mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "$IMAGE_NAME"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag "$IMAGE_NAME" "${{ secrets.DOCKER_HUB_USERNAME }}/$IMAGE_NAME:latest"

      - name: Push Docker Image
        run: |
          docker push "${{ secrets.DOCKER_HUB_USERNAME }}/$IMAGE_NAME:latest"
